            rxbinding         : 'com.jakewharton.rxbinding2:rxbinding:2.2.0',
            statelayout       : 'io.github.shenzhen2017:compose-statelayout:1.0.0',
            // 权限请求框架：https://github.com/getActivity/XXPermissions
            xxPermissions     : 'com.github.getActivity:XXPermissions:12.6',
            // viewModel 绑定依赖
            lifecycle         : 'android.arch.lifecycle:extensions:1.1.1',
            // LiveEventBus
            liveEvent         : 'com.jeremyliao:live-event-bus-x:1.7.2',
            // 主要用于X5WebView
            tencent           : 'com.tencent.tbs.tbssdk:sdk:43967',
            // 沉浸式  详情可参考: https://www.jianshu.com/p/98c1aba92468
            immersionbar      : 'com.gyf.immersionbar:immersionbar:3.0.0',
    ]

    signingKey = [
            storeFile    : 'keystore/app.jks',
            keyAlias     : 'Preter ici',
            keyPassword  : 'Preter ici',
            storePassword: 'Preter ici',
    ]
