ext {
    androidVersion = [
            applicationId            : 'com.reject.dusty.channel',
            compileSdkVersion        : 32,
            buildToolsVersion        : '32.0.0',
            minSdkVersion            : 26,
            versionCode              : 1,
            versionName              : '1.0.0',
            testInstrumentationRunner: "androidx.test.runner.AndroidJUnitRunner"
    ]

    androidX = [
            appcompat: 'androidx.appcompat:appcompat:1.2.0',
            material : 'com.google.android.material:material:1.4.0',
            junit    : 'junit:junit:',
            extjunit : 'androidx.test.ext:junit:1.1.5',
            espresso : 'androidx.test.espresso:espresso-core:3.5.1'
    ]

    api = [
            okhttp            : 'com.squareup.okhttp3:okhttp:4.9.1',
            retrofitGson      : 'com.squareup.retrofit2:converter-gson:2.5.0',
            rxjava            : 'io.reactivex.rxjava2:rxjava:2.2.20',
            rxAndroid         : 'io.reactivex.rxjava2:rxandroid:2.1.1',
            retrofit          : 'com.squareup.retrofit2:retrofit:2.5.0',
            retrofitAdapter   : 'com.squareup.retrofit2:adapter-rxjava2:2.5.0',
            // glide 图片加载框架
            glide             : 'com.github.bumptech.glide:glide:4.12.0',
